name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (pinned binary, checksum verified)
        env:
          GL_VERSION: 8.30.1
          GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: forbid service_role and server secrets in the repo
        run: |
          if git grep -nIiE 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' -- . ':!.github/workflows/security.yml' ':!docs/ops.md'; then
            echo "::error::Server-side secret or service_role reference found. These must never be committed."
            exit 1
          fi
